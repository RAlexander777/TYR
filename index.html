<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TYR: la suite de nuestras historias, recuerdos y promesas. Hecha con amor para Thania."
    />
    <meta name="theme-color" content="#1a1314" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>TYR · Para Thania</title>
    <script>
      (function () {
        try {
          var s = window.location.search;
          var r = document.referrer || '';
          if (s.indexOf('from=') !== -1 || /cumple|historia|puzzle|morpag|flow/.test(r) || sessionStorage.getItem('tyr_skip_loader') === '1') {
            document.documentElement.classList.add('skip-tyr-loader');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Cosmic Loading Screen -->
    <div id="tyrLoader" class="tyr-loader" aria-hidden="true">
      <div class="tyr-loader__backdrop">
        <div class="tyr-loader__glow"></div>
      </div>
      <div class="tyr-loader__content">
        <div class="tyr-loader__logo-wrap">
          <span class="tyr-loader__logo">
            <span class="tyr-word"><span class="tyr-letter">T</span></span><span class="tyr-space">&nbsp;</span><span class="tyr-word"><span class="tyr-letter">Y</span></span><span class="tyr-space">&nbsp;</span><span class="tyr-word"><span class="tyr-letter">R</span></span>
          </span>
        </div>
        <div class="tyr-loader__bar">
          <div class="tyr-loader__progress"></div>
        </div>
      </div>
    </div>

    <main class="hub">
      <header class="hero">
        <h1 class="hero__title hero__title--interactive" role="button" tabindex="0" aria-label="TYR - Toca para desplegar Thania Y Rodrigo" title="Toca para descubrir el significado">
          <span class="tyr-word"><span class="tyr-letter">T</span><span class="tyr-expansion">hania</span></span><span class="tyr-space">&nbsp;</span><span class="tyr-word"><span class="tyr-letter">Y</span></span><span class="tyr-space">&nbsp;</span><span class="tyr-word"><span class="tyr-letter">R</span><span class="tyr-expansion">odrigo</span></span>
        </h1>
      </header>

      <section class="solar-system" aria-label="Universos planetarios">
        <div class="solar-system__stage" tabindex="0" aria-label="Constelación 3D de mundos. Arrastra para orientar la vista o toca un planeta.">
        </div>

        <!-- Planet preview modal card -->
        <div class="planet-preview" aria-hidden="true" role="dialog" aria-modal="true">
          <div class="planet-preview__backdrop"></div>
          <div class="planet-preview__card">
            <button class="planet-preview__close" type="button" aria-label="Cerrar vista previa">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <div class="planet-preview__content">
              <div class="planet-preview__icon-sphere"></div>
              <div class="planet-preview__info">
                <div class="planet-preview__titles">
                  <span class="planet-preview__tag"></span>
                  <h2 class="planet-preview__title"></h2>
                </div>
                <p class="planet-preview__desc"></p>
              </div>
            </div>
            <div class="planet-preview__actions">
              <a class="planet-preview__cta" href="#" tabindex="0">
                <span>Entrar al universo</span>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </section>

      <footer class="hub__footer">
        <p>
          <span aria-hidden="true">❤️</span> Hecho con amor, desde el 4 de septiembre de 2022.
          <small class="hub__credits">
            Modelos 3D:
            <a href="https://sketchfab.com/3d-models/lowpoly-planet-9644beab61d544de8fb93fe8faeb99be" target="_blank" rel="noopener">lowpoly planet</a> de wjs991,
            <a href="https://sketchfab.com/3d-models/little-purple-planet-a4d1c83e660944049a7b7a6b833191db" target="_blank" rel="noopener">Little Purple Planet</a> de Michinata y
            <a href="https://sketchfab.com/3d-models/strawberry-milk-delivery-spaceship-9214b0d216314da5b9a6e9a4e626599a" target="_blank" rel="noopener">Strawberry Milk Delivery Spaceship</a> de Eleanore Falck (CC BY 4.0).
          </small>
        </p>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
